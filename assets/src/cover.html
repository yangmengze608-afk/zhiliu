<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .cover{width:1920px;height:1080px;display:flex;background:#14171a;
         font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;overflow:hidden}
  .left{width:700px;flex:none;padding:96px 72px 96px 96px;display:flex;flex-direction:column;
        justify-content:center;background:linear-gradient(160deg,#1f2328 0%,#14171a 100%);position:relative}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:56px}
  .brand img{width:76px;height:76px;border-radius:18px}
  .brand .n{font-size:42px;font-weight:600;color:#fff;letter-spacing:2px}
  h1{font-size:66px;line-height:1.28;color:#fff;margin:0 0 32px;font-weight:600;letter-spacing:-0.5px}
  h1 em{font-style:normal;color:#4a9eff}
  .sub{font-size:27px;line-height:1.7;color:#9aa4b0;margin:0}
  .rule{width:88px;height:5px;background:#4a9eff;border-radius:3px;margin:44px 0 36px}
  .foot{position:absolute;left:96px;bottom:72px;font-size:21px;color:#6b7683;letter-spacing:.5px}
  .right{flex:1;position:relative;overflow:hidden;background:#f6f6f6}
  .right img{position:absolute;top:22px;left:-10px;width:1880px;height:auto}
  /* 淡出只做一条很窄的接缝。第一版把它开到 34%，正好把面板整个盖掉了 ——
     而面板是这张封面唯一必须让人看见的东西。 */
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,23,26,.88) 0%,rgba(20,23,26,0) 5%)}
  /*
   * 诚实声明。封面是表单必填项，也是评委第一眼看到的东西 ——
   * 而它恰恰曾经是三处用到这张截图的地方里，唯一没带声明的那一处。
   * 图里有知乎 logo、导航栏和一个「1.2 万人赞同」，不写清楚就会被当成
   * "他们在真实知乎上跑出来的"。
   */
  .disc{position:absolute;right:26px;bottom:20px;font-size:15px;color:#8b949e;
        letter-spacing:.2px;text-shadow:0 1px 3px rgba(255,255,255,.7)}
  .vign{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 72%,rgba(0,0,0,.06) 100%)}
</style></head><body>
<div class="cover">
  <div class="left">
    <div class="brand"><img src="http://127.0.0.1:8899/assets/icon-512.png"><span class="n">知流</span></div>
    <h1>你知道自己<br>最近<em>在看什么</em>吗？</h1>
    <div class="rule"></div>
    <p class="sub">推荐系统一直在理解你，<br>而你手上没有同一份仪表盘。</p>
    <div class="foot">知乎黑客松 2026 · 校园新锐季 · 灵魂匹配局</div>
  </div>
  <div class="right"><img src="http://127.0.0.1:8899/assets/screenshot-dashboard.png"><div class="fade"></div><div class="vign"></div>
    <div class="disc">面板为真实构建产物；背景页按知乎版式本地还原，非 zhihu.com 抓图</div></div>
</div>
</body></html>
